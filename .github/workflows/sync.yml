name: sync data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install -r requirements.txt

      - name: run scrapers
        run: |
          python scrapers/rivers.py || true
          python scrapers/weather.py || true
          python scrapers/air.py || true
          python scrapers/dghs.py || true
          python scrapers/catalog.py || true
          python scrapers/notices.py || true
          python scrapers/economy.py || true
          python scrapers/power.py || true

      - name: commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "update data" && git pull --rebase origin main && git push)
